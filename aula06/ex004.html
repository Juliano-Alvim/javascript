<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var nome = window.prompt('Qual o seu nome?')
        var idade = window.prompt('Qual sua idade?')
        document.write(`Olá ${nome}, seu nome todo em letras maiúsculas é ${nome.toUpperCase()}, seu nome tem ${nome.length} letras e você nasceu ${idade} anos atrás.`)
    </script>
</body>
</html>
