<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplicação com JS</title>
</head>
<body>
    <H1>Multiplicando com JS</H1>
    <input type="number" name="txtn1" id="txtn1"> x
    <input type="number" name="txtn2" id="txtn2">
    <input type="button" value="Multiplicar" onclick="clicar()">
    <p id="res">Resultado</p>

    <script>
        function clicar() {
            var res = document.getElementById('res')
            var n1 = Number(document.getElementById('txtn1').value)
            var n2 = Number(document.getElementById('txtn2').value)
            var m = n1 * n2
            res.innerHTML = `O número ${n1} multiplicado por ${n2} é igual a <strong>${m}</strong>`

        }
    </script>
</body>
</html>
