<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
    <style>
        #area {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1.2em;
            color: white;
            background-color: darkgreen;
            height: 200px;
            width: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

    </style>
</head>
<body>
    <div id="area" onclick="clicar()" onmouseenter="entrar()" onmouseout="sair()" onmousedown="pressionar()">
        <p>Interaja...</p>
    </div>

    <script>
        var a = window.document.getElementById('area')
        /* a.addEventListener('click', clicar)
        a.addEventListener('mouseenter', entrar)
        a.addEventListener('mouseout', sair)
        a.addEventListener('mousedown', pressionar) */

        function clicar() {
        a.innerText = 'Clicou!'
        a.style.background = 'red'
        }

        function entrar() {
            a.innerText = 'Entrou!'
        }

        function sair() {
            a.innerText = 'Saiu!'
            a.style.background = 'darkgreen'
        }

        function pressionar() {
            a.innerText = 'Pressionou!'
            a.style.background = 'pink'
        }
    </script>
</body>
</html>
